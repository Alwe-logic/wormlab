[package]
name = "wormlab-wasm"
description = "wormlab-core をブラウザ（WebAssembly）から呼ぶための薄い層。入出力は JSON 文字列"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
# cdylib = WebAssembly のモジュールとして書き出す形、rlib = 普通の Rust ライブラリ（テスト用）
crate-type = ["cdylib", "rlib"]

[dependencies]
wormlab-core = { path = "../wormlab-core" }
wasm-bindgen = "0.2"
serde_json = "1"
