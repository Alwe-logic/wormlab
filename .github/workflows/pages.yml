# Web 版（web/）を GitHub Pages に公開する。
# main に push すると、Rust → WebAssembly（wasm-pack）→ Astro の順にビルドして
# https://alwe-logic.github.io/wormlab/ に置く。
# 初回だけ、リポジトリの Settings → Pages → Build and deployment → Source を
# 「GitHub Actions」にしておく（していないと「Configure Pages」で止まる）。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # Actions の画面から手で動かすこともできる

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Rust (wasm32)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # 2 回目からは前回のビルド結果を使って速くする
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      # web/src/pkg/ に wasm を作る（package.json の "wasm"）
      - name: Build WebAssembly
        working-directory: web
        run: npm run wasm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build site
        working-directory: web
        env:
          # 例：SITE_URL = https://alwe-logic.github.io、BASE_PATH = /wormlab
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
